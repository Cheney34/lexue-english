<script src="js/i18n-data.js"></script>

<script src="js/theme.js"></script>
<script>
/* 引导脚本：必须在其它模块脚本之前定好语言与主题。
 *
 * 原因：TABS、词书名称、评分档位这些是**模块级常量**，脚本一加载就求值。
 * 如果等到界面渲染时再设语言，它们早被「烧」成默认语言了——切一次语言
 * 标签栏还是旧语言，就是这个原因。这里从 localStorage 里先读出偏好，
 * 让常量求值时语言已经就位。
 * 主题也一并先摆好，避免深色模式下先闪一下浅色。 */
(function () {
  var s = null;
  try { s = JSON.parse(localStorage.getItem('wp.settings') || 'null'); } catch (e) {}
  try { I18N.setLang(s && s.lang); } catch (e) {}
  try {
    var pref = (s && s.theme) || 'auto';
    /* 系统是不是深色：先问原生。WebView 的 prefers-color-scheme 在部分 ROM 上
     * 不跟系统走（应用主题是 Light 时尤其明显），只看它会让「跟随系统」永远浅色。 */
    var sysDark = null;
    try {
      var N = window.NativeBridge;
      if (N && typeof N.isSystemDark === 'function') {
        var nv = N.isSystemDark();
        if (typeof nv === 'boolean') sysDark = nv;
        else if (nv === 'true' || nv === 'false') sysDark = (nv === 'true');
      }
    } catch (e) {}
    if (sysDark === null) {
      sysDark = !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
    }
    var dark = pref === 'dark' || (pref === 'auto' && sysDark);
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', dark ? '#141a22' : '#3d5a80');
  } catch (e) {}
})();
</script>
